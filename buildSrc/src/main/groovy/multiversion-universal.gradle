gradle.ext.loadVersionProperties(project.ext)

allprojects {
    tasks.withType(JavaCompile).configureEach {
        def currentVersion = minecraft_version.replace('.', '_')
        options.compilerArgs += ['-Xplugin:Manifold']

        if (minecraft_version ==~ /^\d+\.\d+$/) {
            def parts = minecraft_version.split('\\.')
            def major = parts[0]
            def minor = parts[1]

            options.compilerArgs += ['-AMC' + currentVersion]
            options.compilerArgs += ['-AMC' + major + '_' + minor + '_X']
        } else if (minecraft_version ==~ /^\d+\.\d+\.\d+$/) {
            def parts = minecraft_version.split('\\.')
            def major = parts[0]
            def minor = parts[1]

            options.compilerArgs += ['-AMC' + currentVersion]
            options.compilerArgs += ['-AMC' + major + '_' + minor + '_X']
        } else {
            def sanitized = minecraft_version.toUpperCase().replace('-', '_').replace('.', '_')
            options.compilerArgs += ['-AMC' + sanitized]
            println "Non-standard version ${minecraft_version}: using ${sanitized}." +
                    " Wildcard version preprocessing (e.g., MC1_21_X) is not available for snapshots."
            if (!(sanitized ==~ /^[0-9A-Z_]+$/)) {
                println "WARNING: Invalid version detected (${minecraft_version})."
            }
        }
    }

    dependencies {
        annotationProcessor "systems.manifold:manifold-preprocessor:2026.1.0"
        testAnnotationProcessor "systems.manifold:manifold-preprocessor:2026.1.0"

        // Test dependencies
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    // Ensure test source set has access to Minecraft dependencies from moddev
    sourceSets {
        test {
            compileClasspath += sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.runtimeClasspath
        }
    }

    test {
        useJUnitPlatform()
    }
}
