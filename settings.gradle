pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('net.fabricmc.unpick')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.minecraftforge')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'MultiLoader-Template'

def loadVersionProperties = { ExtraPropertiesExtension namespace ->
    def minecraftVersion = providers.gradleProperty('minecraft_version').getOrNull()
    if (!minecraftVersion) {
        throw new GradleException("The 'minecraft_version' property is required in gradle.properties")
    }

    def versionFile = rootDir.toPath().resolve("versions/${minecraftVersion}.properties").toFile()
    if (!versionFile.exists()) {
        throw new GradleException("Version properties file not found: versions/${minecraftVersion}.properties")
    }

    def props = new Properties()
    versionFile.withInputStream { props.load(it) }

    props.each { key, value -> namespace.set(key as String, value) }

    println "Version properties loaded for Minecraft ${minecraftVersion}"
}

gradle.ext.loadVersionProperties = loadVersionProperties
loadVersionProperties(settings.ext)

include('common')

void includeMODLoader(String loaderProperty, String loaderName, String projectPath) {
    if (settings.hasProperty(loaderProperty)) {
        println "${loaderName.capitalize()} loader included, version: ${settings.ext.get(loaderProperty)}"
        include(projectPath)
    } else {
        println "${loaderName.capitalize()} loader skipped: '${loaderProperty}' not set"
    }
}

includeMODLoader("fabric_version", "Fabric", "fabric")
includeMODLoader("neoforge_version", "NeoForge", "neoforge")
includeMODLoader("forge_version", "Forge", "forge")
